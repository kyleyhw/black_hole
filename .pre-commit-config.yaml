repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json

  # ruff and ty run via uv so the versions come from validation/uv.lock
  # rather than a separately pinned hook repo.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd validation && uv run ruff check .'
        language: system
        files: ^validation/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd validation && uv run ruff format --check .'
        language: system
        files: ^validation/.*\.py$
        pass_filenames: false
      - id: ty
        name: ty
        entry: bash -c 'cd validation && uv run ty check .'
        language: system
        files: ^validation/.*\.py$
        pass_filenames: false
